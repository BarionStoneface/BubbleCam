# Copy to config.yaml and edit. Anything left out uses the defaults in bubblecam/config.py.

camera:
  source: v4l2            # "synthetic" runs a fake tank, handy for trying the app without the camera
  device: /dev/video0
  width: 1280
  height: 800
  fps: 30
  manual_exposure: true
  # In units of 100 microseconds on most UVC cameras: 150 = 15 ms.
  # Keep it under 333 or the camera can't hold 30 fps. Raise gain before exposure if the night image is dark.
  exposure: 150
  gain: 0

record:
  segment_minutes: 10
  encoder: auto           # Pi 4 hardware encoder if it works, otherwise libx264
  bitrate: 1500k          # about 16 GB a day of real time footage

detect:
  diff_threshold: 14      # raise if night sensor grain triggers motion
  min_blob_area: 12       # raise if shrimp and snails trigger the pleco zone

# How eager each tank is (spotlighted animals, bursts) is set per tank in the app:
# Setup > Advanced > sensitivity. These are the rest of the event timings.
zone_events:
  end_seconds: 15         # a moment ends after this long with no movement
  pre_roll: 10
  post_roll: 5
  max_seconds: 600        # longer stretches are split into 10 minute moments

burst_events:
  enabled: true
  floor: 0.02             # a burst must also be at least this much of the picture moving

feeding:
  top_share: 0.55         # feeding = a burst with most of the movement in the top quarter of the picture

chase:
  enabled: true           # darts and chases at night while the tank is quiet
  speed: 0.5              # frame widths per second that counts as a dart

danger:
  bubble_stop_seconds: 180   # bubbles near still this long = alert (switch on per tank in Setup)
  surface_minutes: 30        # fish crowding the surface this long (not after feeding) = note
  day_start: "10:00"         # daytime stillness is only checked between these times
  day_end: "18:00"

timelapse:
  max_speed: 300          # quiet stretches
  min_speed: 2            # while he's moving (1 = real time)
  ease_seconds: 20
  driver: spots           # spots (spotlighted animals), tank, or both
  nightly_at: "09:00"     # render last night automatically at this time ("" to turn off)
  night_start: "19:00"
  night_end: "09:00"

storage:
  data_dir: /mnt/bubblecam/data
  min_free_gb: 3          # oldest raw footage is deleted below this
  clip_days: 30           # moments are kept this long (starred or tagged ones forever)
  timelapse_days: 90      # timelapses too (starred ones forever)

# Phone notifications are switched on in the app (Setup). To change the time of the morning
# summary, uncomment:
# notify:
#   morning_at: "09:05"

web:
  # 127.0.0.1 keeps it off your home network; Tailscale serve and the Pi's own screen still reach it.
  host: 127.0.0.1
  port: 8080
