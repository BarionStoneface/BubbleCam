<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
<title>BubbleCam</title>
</head>
<body>
<header class="top">
  <button class="back" id="back" hidden aria-label="Back">‹</button>
  <h1 id="title">BubbleCam</h1>
  <div class="mode" id="mode" role="group" aria-label="Mode"><button type="button" data-m="tank">Tank</button><button type="button" data-m="free">Free</button></div>
  <button class="health" id="health" type="button" aria-label="System status"><i></i><span>All good</span></button>
  <button class="gear" id="gear" type="button" aria-label="Setup">⚙︎</button>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <a href="#free" data-tab="free" data-mode="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>Camera</a>
  <a href="#recordings" data-tab="recordings" data-mode="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16v12H4z"/><path d="M8 7V4h8v3"/><path d="M10 11l4 2.5-4 2.5z"/></svg>Recordings</a>
  <a href="#tanks" data-tab="tanks" data-mode="tank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15c3-2 5 1 8-1s5-2 10 0"/><circle cx="9" cy="10" r="1.2"/></svg>Tanks</a>
  <a href="#moments" data-tab="moments" data-mode="tank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Moments</a>
  <a href="#timelapses" data-tab="timelapses" data-mode="tank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>Timelapses</a>
  <a href="#trends" data-tab="trends" data-mode="tank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>Trends</a>
</nav>

<dialog id="player">
  <div id="pzoom"><video id="pvideo" controls playsinline></video></div>
  <div style="display:grid;gap:12px;margin-top:12px">
    <div class="row"><div class="grow"><b id="ptitle"></b><div class="dim" id="pinfo"></div></div>
      <button class="star" id="pstar" title="Keep forever">★</button></div>
    <div class="tag-editor" id="ptags"></div>
    <div class="row">
      <button class="btn small" id="pwrong">This was wrong</button>
      <button class="btn small" id="pdownload" type="button">Download</button>
      <button class="btn small" id="pdelete">Delete</button>
      <span class="grow"></span>
      <button class="btn small" id="pclose">Close</button>
    </div>
  </div>
</dialog>

<dialog id="ask">
  <p id="ask-text" style="margin:0 0 14px"></p>
  <input type="text" id="ask-input" hidden maxlength="40" style="width:100%;margin-bottom:14px">
  <div class="row" style="justify-content:flex-end"><button class="btn small" id="ask-no">Cancel</button><button class="btn small primary" id="ask-yes">OK</button></div>
</dialog>

<dialog id="sheet">
  <div id="sheet-body"></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn small" id="sheet-close">Close</button></div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
